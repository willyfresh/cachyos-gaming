# Fuzzel only wraps Terminal=true apps when this is set.
# $TERMINAL is unset in the Hyprland session, so the compiled default
# launches nvim with stdin on /dev/null and the window never appears.
terminal=alacritty -e
font=MesloLGS Nerd Font Mono:size=14

# Novalis. #0A0D0B is near black with a green cast, not #000000.
# The selected row is the green chip with near-black text.
[colors]
background=0a0d0bff
text=c8d4c8ff
prompt=5cff6bff
placeholder=7a9a7aff
input=c8d4c8ff
match=5cff6bff
selection=5cff6bff
selection-text=07100aff
selection-match=07100aff
counter=7a9a7aff
border=5cff6bff

[border]
width=2
radius=0

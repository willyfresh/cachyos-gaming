# Super+L. Novalis colors. A blurred shot of the desktop is the background.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot
    color = rgba(10, 13, 11, 1.0)
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.1
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(92, 255, 107, 1.0)
    inner_color = rgba(10, 13, 11, 0.85)
    font_color = rgba(200, 212, 200, 1.0)
    font_family = Roboto
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    rounding = 0
    check_color = rgba(92, 255, 107, 1.0)
    fail_color = rgba(139, 26, 26, 1.0)
    fail_text = <i>$FAIL</i>
    halign = center
    valign = center
    position = 0, -40
}

label {
    monitor =
    text = cmd[update:1000] date +"%a %m-%d  %H:%M"
    color = rgba(92, 255, 107, 1.0)
    font_size = 28
    font_family = Roboto
    halign = center
    valign = center
    position = 0, 48
}

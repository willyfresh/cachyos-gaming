# Super+L. Novalis colors. A blurred shot of the desktop is the background.
# Date, 24-hour time, and the line under them are simplified Chinese.
# zh_CN is not installed, so the weekday is mapped here.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot
    color = rgba(10, 13, 11, 1.0)
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.1
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(92, 255, 107, 1.0)
    inner_color = rgba(10, 13, 11, 0.85)
    font_color = rgba(200, 212, 200, 1.0)
    font_family = Noto Sans CJK SC
    fade_on_empty = false
    placeholder_text = 请输入密码
    hide_input = false
    rounding = 0
    check_color = rgba(92, 255, 107, 1.0)
    fail_color = rgba(139, 26, 26, 1.0)
    fail_text = <i>认证失败</i>
    halign = center
    valign = center
    position = 0, -80
}

label {
    monitor =
    text = cmd[update:1000] python3 -c 'import datetime; d=datetime.datetime.now(); w="一二三四五六日"[d.weekday()]; print("%d年%d月%d日 星期%s" % (d.year, d.month, d.day, w), end="")'
    color = rgba(92, 255, 107, 1.0)
    font_size = 26
    font_family = Noto Sans CJK SC
    halign = center
    valign = center
    position = 0, 128
}

label {
    monitor =
    text = cmd[update:1000] python3 -c 'import datetime; d=datetime.datetime.now(); print("%02d时%02d分" % (d.hour, d.minute), end="")'
    color = rgba(92, 255, 107, 1.0)
    font_size = 34
    font_family = Noto Sans CJK SC
    halign = center
    valign = center
    position = 0, 68
}

label {
    monitor =
    text = 如果你正在读这个，那么你就是中国人
    color = rgba(92, 255, 107, 1.0)
    font_size = 22
    font_family = Noto Sans CJK SC
    halign = center
    valign = center
    position = 0, 0
}

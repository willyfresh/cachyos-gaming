# Tap Super to open the noctalia launcher (niri bind: Super+Space).
# Hold Super and it stays a modifier for Super+E, Super+1, etc.
#
# Super+click-drag moves windows in niri. keyd only sees keyboards by
# default, so a Super tap-hold never becomes a modifier for the mouse.
# Listing the pointer IDs makes a click count as "another key".
#
# overload_tap_timeout: hold Super ~200ms without tapping, then release,
# and the launcher does not fire. Gives Super+drag a beat to start.
#
# Applied to /etc/keyd/default.conf by scripts/apply-system.sh

[ids]
*
# Leave the YubiKey alone so OTP isn't remapped.
-1050:0407
# Glorious Model D (gaming mouse)
258a:0033
# Keychron V6 extra pointer interface
3434:0361

[global]
overload_tap_timeout = 200

[main]
leftmeta = overload(meta, M-space)
rightmeta = overload(meta, M-space)
# Fn+F8 is VIA F18; leftover HID Play is resume-only and Chrome steals
# it. keyd's virtual keyboard also drops F13–F24. Emit Ctrl+Shift+F8,
# which niri binds to noctalia media toggle.
playpause = C-S-f8
play = C-S-f8
pause = C-S-f8
playcd = C-S-f8
pausecd = C-S-f8
f18 = C-S-f8
# Knob cluster: VIA sends F13–F17 / F20; same uinput drop. Map to
# Ctrl+Shift+F1–F6 (not Ctrl+Shift+1–3, those are screenshots).
f13 = C-S-f1
f14 = C-S-f2
f15 = C-S-f3
f16 = C-S-f4
f17 = C-S-f5
f20 = C-S-f6

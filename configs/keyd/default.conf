# Super is a modifier only. A press by itself does nothing.
# Super+Space opens Fuzzel.
#
# Applied to /etc/keyd/default.conf by scripts/apply-system.sh

[ids]
*
# Leave the YubiKey alone so OTP isn't remapped.
-1050:0407

[main]
# Fn+F8 is VIA F18; leftover HID Play is resume-only and Chrome steals
# it. keyd's virtual keyboard also drops F13–F24. Emit Ctrl+Shift+F8.
# Both sessions send that to playerctl.
playpause = C-S-f8
play = C-S-f8
pause = C-S-f8
playcd = C-S-f8
pausecd = C-S-f8
f18 = C-S-f8
# Knob cluster: VIA sends F13–F17 / F20; same uinput drop. Map to
# Ctrl+Shift+F1 and F3–F6. Circle is Super+N. Triangle is the update
# list. Square is the devices menu. Light (F13) and X (F17) stay open.
f13 = C-S-f1
f14 = M-n
f15 = C-S-f3
f16 = C-S-f4
f17 = C-S-f5
f20 = C-S-f6

[idle]
behavior_order = ["screensaver"]
pre_action_fade_seconds = 0

[idle.behavior.screensaver]
timeout = 150
action = "command"
enabled = true
command = "niri-screensaver-ctl launch"
resume_command = "niri-screensaver-ctl kill"

[idle.behavior.lock]
timeout = 300
action = "command"
enabled = false
command = "/home/willyfresh/.local/bin/lock.sh"

[lockscreen]
enabled = true
lock_before_suspend = true
blurred_desktop = false
blur_intensity = 0.0
tint_intensity = 0.12

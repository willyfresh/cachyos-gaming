#:schema https://yazi-rs.github.io/schemas/yazi.json

# Enter and o open text, unknown files, and directories in nvim.
# Right enters a directory. Left leaves it.
# Images open in swayimg. PDFs open in zathura.
# Audio, video, and archives keep Yazi's default openers.
# O still lists the other openers.

[opener]
edit = [
	{ run = "nvim %s", desc = "LazyVim", block = true, for = "unix" },
]
view = [
	{ run = "swayimg %s", desc = "Image Viewer", orphan = true, for = "linux" },
]
read = [
	{ run = "zathura %s", desc = "PDF Reader", orphan = true, for = "linux" },
]
grok = [
  { run = "grok %s", desc = "Grok", block = true, for = "unix" },
]
tty = [
  { run = "kitty %s", desc = "Terminal", block = true, for = "unix" },
]


[open]
prepend_rules = [
	{ mime = "image/*", use = [ "view", "open", "reveal" ] },
	{ mime = "application/pdf", use = [ "read", "reveal" ] },
  { url = "*/", use = [ "edit", "tty", "grok"  ] }
]
append_rules = [
	{ url = "*", use = [ "edit", "tty", "reveal", "read" ] },
]

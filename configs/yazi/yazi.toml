#:schema https://yazi-rs.github.io/schemas/yazi.json

# Enter and o open text, unknown files, and directories in nvim.
# Right enters a directory. Left leaves it.
# Images open in swayimg. PDFs open in zathura.
# Audio, video, and archives keep Yazi's default openers.
# O still lists the other openers.

[opener]
edit = [
	{ run = "nvim %s", desc = "nvim", block = true, for = "unix" },
]
view = [
	{ run = "swayimg %s", desc = "swayimg", orphan = true, for = "linux" },
]
read = [
	{ run = "zathura %s", desc = "zathura", orphan = true, for = "linux" },
]

[open]
prepend_rules = [
	{ mime = "image/*", use = [ "view", "open", "reveal" ] },
	{ mime = "application/pdf", use = [ "read", "edit", "reveal" ] },
]
append_rules = [
	{ url = "*", use = [ "edit", "open", "reveal" ] },
]

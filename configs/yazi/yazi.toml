#:schema https://yazi-rs.github.io/schemas/yazi.json

# Enter and o open text, unknown files, and directories in nvim.
# Right enters a directory. Left leaves it.
# Images open in swayimg. PDFs open in zathura.
# Audio and video open in VLC. O on a video also lists Kdenlive.
# A .kdenlive project opens in Kdenlive. Archives keep Yazi's default openers.
# O still lists the other openers.

[[opener.vim]]
run = "nvim %s"
desc = "LazyVim"
block = true

[[opener.img]]
run = "swayimg %s"
desc = "Image Viewer"
orphan = true

[[opener.pdf]]
run = "zathura %s"
desc = "PDF Reader"
orphan = true

[[opener.vlc]]
run = "vlc --started-from-file %s"
desc = "VLC"
orphan = true

[[opener.kdenlive]]
run = "kdenlive %s"
desc = "Kdenlive"
orphan = true

[[opener.grok]]
run = "grok --cwd %s"
desc = "Grok"
block = true

[[opener.tty]]
run = "kitty --directory %s1"
desc = "Terminal"
orphan = true

# open rules

[[open.prepend_rules]]
mime = "image/*"
use = [ "img", "reveal" ]

[[open.prepend_rules]]
mime = "application/pdf"
use = [ "pdf", "reveal" ]

[[open.prepend_rules]]
mime = "video/*"
use = [ "vlc", "kdenlive", "reveal" ]

[[open.prepend_rules]]
mime = "audio/*"
use = [ "vlc", "reveal" ]

[[open.prepend_rules]]
mime = "application/ogg"
use = [ "vlc", "reveal" ]

[[open.prepend_rules]]
mime = "application/x-ogg"
use = [ "vlc", "reveal" ]

[[open.prepend_rules]]
mime = "application/x-matroska"
use = [ "vlc", "kdenlive", "reveal" ]

[[open.prepend_rules]]
mime = "application/x-kdenlive"
use = [ "kdenlive", "reveal" ]

[[open.prepend_rules]]
url = "*/"
use = [ "vim", "grok", "tty" ]

[[open.append_rules]]
url = "*"
use = [ "vim", "reveal" ]

